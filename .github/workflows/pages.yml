name: Deploy results showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the showcase
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Check JavaScript and entrypoint
        run: |
          test -f showcase/index.html
          node --check showcase/app.js
          node --check showcase/data.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static showcase
        uses: actions/upload-pages-artifact@v4
        with:
          path: showcase
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
